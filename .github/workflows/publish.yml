name: Build and Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install mime-types (only runtime dependency)
        run: npm install mime-types@^2.1.35 --no-save --ignore-scripts

      - name: Build with TypeScript (via npx)
        run: npx -p typescript@^5.3.3 tsc

      - name: Copy icon to dist
        run: cp nodes/telegram.svg dist/nodes/telegram.svg

      - name: Create dist index files
        run: |
          echo '"use strict";' > dist/index.js
          echo 'Object.defineProperty(exports, "__esModule", { value: true });' >> dist/index.js
          echo 'exports.nodeClasses = exports.credentialClasses = void 0;' >> dist/index.js
          echo 'const Telegram_node_1 = require("./nodes/Telegram.node");' >> dist/index.js
          echo 'const TelegramTrigger_node_1 = require("./nodes/TelegramTrigger.node");' >> dist/index.js
          echo 'const TelegramApiProxy_credentials_1 = require("./credentials/TelegramApiProxy.credentials");' >> dist/index.js
          echo 'exports.nodeClasses = [new Telegram_node_1.Telegram(), new TelegramTrigger_node_1.TelegramTrigger()];' >> dist/index.js
          echo 'exports.credentialClasses = [new TelegramApiProxy_credentials_1.TelegramApiProxy()];' >> dist/index.js

      - name: Verify build
        run: ls -la dist/

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            Published to npm as @sajjadsaharkhan/n8n-nodes-telegram-proxy@${{ github.ref_name }}

            ## Installation

            ```bash
            npm install @sajjadsaharkhan/n8n-nodes-telegram-proxy
            ```
          draft: false
          prerelease: false
