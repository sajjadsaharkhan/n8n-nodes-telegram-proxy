name: Build and Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install runtime dependencies only
        run: npm install --production --ignore-scripts

      - name: Install TypeScript
        run: npm install -D typescript@^5.3.3

      - name: Build TypeScript
        run: npx tsc

      - name: Copy icon to dist
        run: cp nodes/telegram.svg dist/nodes/telegram.svg

      - name: Verify build
        run: ls -la dist/

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            Published to npm as @sajjadsaharkhan/n8n-nodes-telegram-proxy@${{ github.ref_name }}

            ## Installation

            ```bash
            npm install @sajjadsaharkhan/n8n-nodes-telegram-proxy
            ```
          draft: false
          prerelease: false
